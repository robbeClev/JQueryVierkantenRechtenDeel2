<!DOCTYPE html>
<html>
    <head>
        <title>W3.CSS</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">

        <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
        <link rel="stylesheet" href="style.css">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
<body class="w3-content">
 
    <header class="w3-bar w3-pink">
        <div class="w3-bar-item">Welkom bij Vierkanten en Rechthoeken</div>
        <div class="w3-bar-item w3-button w3-gray" id="showAll">Toon alles</div>
    </header>

    <main class="w3-container">
        <div class="vierkant w3-red w3-border-black w3-margin">click me</div>
        <div class="vierkant w3-blue w3-border-black w3-margin">doubleclick me</div>
        <div class="vierkant w3-green w3-border-black w3-margin">hover me</div>
        <div class="vierkant w3-yellow w3-border-black w3-margin">mouse enter me</div>
        <div class="rechthoek w3-red w3-border-black w3-margin">fill me</div>
        <div class="rechthoek w3-border-black w3-blue w3-margin">read me</div>
        <div class="rechthoek w3-border-black w3-green w3-margin">hide me</div>
        <div class="rechthoek w3-border-black w3-yellow w3-margin">move me</div>
        
    </main>

    <footer class="w3-bottom w3-bar w3-pink">
        <p class="w3-bar-item w3-center">© 2026 by Robbe Clevers</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
